syntax = "proto3";

package the_deal.schema;

import "monopoly_deal.proto";
import "deal_no_mercy.proto";
import "room.proto";

option go_package = "the-deal/internal/schema;schema";

message Ping {
  int64 time_unix_ms = 1;
}

message ClientMessage {
  oneof payload {
    Ping ping = 1;

    the_deal.schema.room.ClientMessage room_message = 10;
    the_deal.schema.monopoly_deal.ClientMessage monopoly_deal_message = 11;
    the_deal.schema.deal_no_mercy.ClientMessage deal_no_mercy_message = 12;
  }
}

message ServerMessage {
  oneof payload {
    Ping ping = 1;

    the_deal.schema.room.ServerMessage room_message = 10;
    the_deal.schema.monopoly_deal.ServerMessage monopoly_deal_message = 11;
    the_deal.schema.deal_no_mercy.ServerMessage deal_no_mercy_message = 12;
  }
}
