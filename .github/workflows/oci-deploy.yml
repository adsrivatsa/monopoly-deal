name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build + deploy on OCI instance
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
        run: |
          ssh -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} "
            set -e
          
            echo 'Pulling latest code...'
            cd '${PROJECT_ROOT}'
            git pull
          
            echo 'Building backend...'
            cd src/backend && go build -o app ./cmd/api
          
            echo 'Building frontend...'
            cd ../frontend && npm ci && npm run build
          
            echo 'Restarting services...'
            cd ..
            pm2 reload backend || pm2 restart backend
            pm2 reload frontend || pm2 restart frontend
          
            echo 'Deployment complete!'
          "